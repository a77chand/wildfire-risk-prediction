name: Site
# Rebuilds this season's data (weather + fire records -> web/data/season.json) and deploys web/
# to GitHub Pages: every Monday, on pushes that touch the site, or by hand.
on:
  schedule:
    - cron: "0 14 * * 1"
  push:
    branches: [main]
    paths: ["web/**", "wildfire/**", "artifacts/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # NASA POWER or the BC data server can be down. Then the site keeps the last committed data
      # rather than failing: season.json says when it was generated and the page shows that date.
      - name: Refresh this season's data
        continue-on-error: true
        run: python -m wildfire.cli site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
