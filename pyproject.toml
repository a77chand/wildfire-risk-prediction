[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire"
version = "0.2.0"
description = "Weekly, grid-cell wildfire ignition risk for British Columbia from weather, the Canadian FWI System and historical ignitions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "matplotlib>=3.8",
    "geopandas>=0.14",
    "shapely>=2.0",
    "folium>=0.16",
    "requests>=2.31",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pyarrow>=15",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "jupyter", "nbconvert", "ipykernel"]

[project.scripts]
wildfire = "wildfire.cli:main"

[tool.setuptools.packages.find]
include = ["wildfire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
